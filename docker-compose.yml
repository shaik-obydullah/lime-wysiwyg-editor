services:
  editor:
    build: .
    container_name: lime-wysiwyg-editor
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: wysiwyg
      DB_USER: editor
      DB_PASS: editor_pass
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mysql:8.0
    container_name: lime-wysiwyg-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wysiwyg
      MYSQL_USER: editor
      MYSQL_PASSWORD: editor_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  adminer:
    image: adminer
    container_name: lime-wysiwyg-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: "no"

volumes:
  db_data:
    name: lime-wysiwyg-db-data
